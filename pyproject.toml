[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pratyabhijna-world-model"
version = "0.1.0"
description = "Pratyabhijñā World Model: Creative AI through Recognition, Active Inference, and Associative Memory"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SharathSPhD", email = "qbz506@york.ac.uk"},
]
keywords = ["active-inference", "world-model", "creative-ai", "kashmir-shaiva", "dreamerv3"]

dependencies = [
    # Core ML
    "torch>=2.10.0",
    "torchvision",
    # World model base
    "numpy>=1.26",
    "scipy>=1.13",
    # Active inference
    "inferactively-pymdp>=0.0.7",
    # Hopfield networks (native implementation in pwm/memory/citta_store.py)
    # hflayers available via: pip install git+https://github.com/ml-jku/hopfield-layers.git
    # LLM backend
    "litellm>=1.50.0",
    "smolagents>=1.9.0",
    # Config management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
    # Experiment tracking
    "wandb>=0.17",
    "mlflow>=2.14",
    # Data processing
    "datasets>=3.0",   # HuggingFace
    "tokenizers>=0.19",
    "sentencepiece>=0.2",
    # Memory / retrieval
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    # Corpus annotation (optional: pip install indic-nlp-library aksharamukha)
    # Evaluation
    "scipy>=1.13",
    "dtaidistance>=2.3",  # DTW for camatkāra timing correlation
    # Clustering (sleep consolidation)
    "scikit-learn>=1.5",
    # Utilities
    "tqdm>=4.66",
    "rich>=13.7",
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
paper = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "plotly>=5.22",
]
local-llm = [
    "vllm>=0.5",
    "llama-cpp-python>=0.2.90",
    "tensorrt-llm",  # install separately via NGC
]

[project.scripts]
pwm-train = "pwm.scripts.train:main"
pwm-eval = "pwm.scripts.evaluate:main"
pwm-trace = "pwm.scripts.trace:main"
pwm-serve = "pwm.scripts.serve_llm:main"
pwm-corpus = "corpus.build:main"

[tool.hatch.build.targets.wheel]
packages = ["pwm", "corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
